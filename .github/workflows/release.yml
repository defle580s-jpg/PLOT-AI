name: Release PLOT AI
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup NDK 27.1
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006" || true
      - name: Install all deps at once
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config nasm yasm git ninja-build
          pip install meson ninja jinja2 mako
          cmake --version
          pkg-config --version
      - name: Build native libs
        run: chmod +x scripts/build_all.sh && bash scripts/build_all.sh
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLOT-AI-APK
          path: app/build/outputs/apk/release/*.apk
